# IP whitelist for Orbitalpha Trading admin UI (Nginx allow/deny).
#
# How to use
# - Install to: /etc/nginx/conf.d/trade.orbitalpha.kr.ip-whitelist.conf
# - Referenced by: trade.orbitalpha.kr.conf via `include ...`
#
# Notes
# - Use /32 for single IPs (recommended).
# - Keep this list small (home + office + backup).
#
# TODO: replace these placeholders with your real public IPs.
allow 203.0.113.10/32;  # home (example)
allow 198.51.100.20/32; # office (example)

# Always deny everything else.
deny all;

