# Install: /etc/nginx/sites-available/trade.orbitalpha.kr
# Enable:  ln -sf /etc/nginx/sites-available/trade.orbitalpha.kr /etc/nginx/sites-enabled/
# Remove default site if it conflicts: rm -f /etc/nginx/sites-enabled/default
#
# Next.js dashboard (3010) proxies /api → 127.0.0.1:8787 via next.config rewrites.
# Nginx only fronts the dashboard.

server {
    listen 80;
    listen [::]:80;
    server_name trade.orbitalpha.kr;

    client_max_body_size 20m;

    # Admin UI access control (IP whitelist at Nginx edge)
    # Install whitelist file to: /etc/nginx/conf.d/trade.orbitalpha.kr.ip-whitelist.conf
    include /etc/nginx/conf.d/trade.orbitalpha.kr.ip-whitelist.conf;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }
}
